name: Desktop
# Construit l'installateur Windows de Selene (Tauri 2, docs/desktop.md) : la page native (dist/native) dans la
# WebView du système (WebView2), et le cœur Rust (native/tauri) : ses tests, puis l'installateur NSIS, déposé en
# artefact. Les runners Windows de GitHub ont déjà Rust et WebView2. Puis la fumée de l'app installée (BL-08,
# scripts/windows-fumee.mjs) : installée en silence, lancée, relancée, une seule instance.
on:
  pull_request:
    paths: ['src/**', 'native/tauri/**', 'package.json', 'package-lock.json', 'build.py', 'scripts/windows-fumee.mjs', 'scripts/android-fumee.mjs', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['src/**', 'native/tauri/**', 'package.json', 'package-lock.json', 'build.py', 'scripts/windows-fumee.mjs', 'scripts/android-fumee.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Cargo (dépendances et compilation)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run build:dist
      - name: Tests du cœur Rust
        working-directory: native/tauri
        run: cargo test --locked
      - name: Installateur (NSIS)
        working-directory: native/tauri
        run: npx tauri build --ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selene-windows
          path: native/tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
      # La variante de la fumée : la même app, dont la WebView2 ouvre le protocole de débogage sur 127.0.0.1:9333
      # (additionalBrowserArgs ; wry passe ses propres arguments à WebView2, qui ignore alors la variable
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS). Construite après le dépôt de l'installateur publié, jamais déposée.
      - name: Variante de la fumée (débogage de la WebView2)
        working-directory: native/tauri
        shell: pwsh
        run: |
          node ../../scripts/windows-fumee.mjs config "$env:RUNNER_TEMP/tauri.fumee.json"
          npx tauri build --ci --config "$env:RUNNER_TEMP/tauri.fumee.json"
      # Rien de la fumée ne part vers le vrai serveur : le projet Supabase de l'app (lu dans auth.js) ne se résout plus.
      - name: Projet Supabase injoignable pour la fumée
        shell: pwsh
        run: |
          $ref = (Select-String -Path src/app/services/auth.js -Pattern 'https://([a-z0-9]+)\.supabase\.co').Matches[0].Groups[1].Value
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "0.0.0.0 $ref.supabase.co`n:: $ref.supabase.co"
          ipconfig /flushdns | Out-Null
          if ((Resolve-DnsName "$ref.supabase.co" -ErrorAction SilentlyContinue | Where-Object { $_.IPAddress -and $_.IPAddress -notin @('0.0.0.0', '::') })) { Write-Error "le projet se résout encore"; exit 1 }
      - name: Fumée de l'app installée
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = (Get-ChildItem native/tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          node scripts/windows-fumee.mjs "$setup" "$env:RUNNER_TEMP/fumee-windows"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fumee-windows
          path: ${{ runner.temp }}/fumee-windows
          retention-days: 14
