name: Desktop
# Construit l'installateur Windows de Selene (Tauri 2, docs/desktop.md) : la page native (dist/native) dans la
# WebView du système (WebView2), et le cœur Rust (native/tauri) : ses tests, puis l'installateur NSIS, déposé en
# artefact. Les runners Windows de GitHub ont déjà Rust et WebView2.
on:
  pull_request:
    paths: ['src/**', 'native/tauri/**', 'package.json', 'package-lock.json', 'build.py', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['src/**', 'native/tauri/**', 'package.json', 'package-lock.json', 'build.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Cargo (dépendances et compilation)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run build:dist
      - name: Tests du cœur Rust
        working-directory: native/tauri
        run: cargo test --locked
      - name: Installateur (NSIS)
        working-directory: native/tauri
        run: npx tauri build --ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selene-windows
          path: native/tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
