name: Pages
# Publie le site seulement si Check est vert. Nécessite, une fois :
# Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # La sortie web, construite depuis les sources (la même que index.html, vérifiée par le job check).
      - run: npm run build:dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v5
