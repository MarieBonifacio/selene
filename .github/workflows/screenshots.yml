name: Captures
# Les captures d'écran des stores (scripts/store-screenshots.mjs, docs/publication.md) : à la demande, en artefact.
# Ici, les polices de Selene (Google Fonts) se chargent, ce que certains environnements de travail bloquent.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selene-captures
          path: dist/store/
          retention-days: 30
