name: Captures
# Les captures d'écran des stores (scripts/store-screenshots.mjs, docs/publication.md) : à la demande, en artefact.
# Ici, les polices de Selene (Google Fonts) se chargent, ce que certains environnements de travail bloquent.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selene-captures
          path: dist/store/
          retention-days: 30
