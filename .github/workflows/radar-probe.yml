name: Sonde radar (temporaire)
on:
  push:
    branches: [claude/affectionate-carson-3ax1gp]
    paths: ['.github/workflows/radar-probe.yml']
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Export complet
        run: |
          set +e
          W='lastdate_end%20%3E%3D%20date%272026-09-30%27%20and%20firstdate_begin%20%3C%20date%272026-10-14%27%20and%20within_distance(location_coordinates%2C%20geom%27POINT(3.1%2050.6)%27%2C%2020km)'
          S='uid%2Ctitle_fr%2Cdescription_fr%2Ckeywords_fr%2Cfirstdate_begin%2Clastdate_end%2Clocation_name%2Clocation_city%2Ccanonicalurl'
          B='https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda'
          curl -sS -m 60 -D h.txt -H "Origin: https://mariebonifacio.github.io" -o e.json -w "exports HTTP %{http_code} %{content_type} taille %{size_download} temps %{time_total}\n" "$B/exports/json?where=$W&select=$S&order_by=firstdate_begin&limit=-1"
          grep -i "^access-control-allow-origin\|^content-encoding" h.txt
          curl -sS -m 60 --compressed -o /dev/null -w "gzip: taille %{size_download}\n" "$B/exports/json?where=$W&select=$S&order_by=firstdate_begin&limit=-1"
          python3 - <<'PY'
          import json, collections
          d = json.load(open('e.json')); print('type', type(d).__name__, 'n', len(d))
          print('premier', json.dumps(d[0], ensure_ascii=False)[:600])
          dur = collections.Counter()
          for r in d:
            a, b = r['firstdate_begin'][:10], r['lastdate_end'][:10]
            dur['<=1j' if a == b else '<=14j' if b <= '2026-10-14' or a >= '2026-09-30' else 'long'] += 1
          print(dur)
          print('kw types', collections.Counter(type(r.get('keywords_fr')).__name__ for r in d))
          PY
          curl -sS -m 30 -o r.json -w "records limit 100: HTTP %{http_code}\n" "$B/records?where=$W&select=$S&order_by=firstdate_begin&limit=101"; head -c 300 r.json; echo
