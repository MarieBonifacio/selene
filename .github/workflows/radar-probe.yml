name: Sonde radar (temporaire)
on:
  push:
    branches: [claude/affectionate-carson-3ax1gp]
    paths: ['.github/workflows/radar-probe.yml']
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Nouveau portail
        run: |
          set +e
          p() { echo "=== $1"; curl -sS -m 30 -D h.txt -H "Origin: https://mariebonifacio.github.io" -o b.txt -w "HTTP %{http_code} %{content_type} taille %{size_download}\n" "$1"; grep -i "^location\|^access-control" h.txt; head -c ${2:-1200} b.txt; echo; }
          p "https://data.lillemetropole.fr/" 600
          p "https://data.lillemetropole.fr/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda/records?limit=1"
          p "https://data.lillemetropole.fr/api/explore/v2.1/catalog/datasets?where=search(%22agenda%22)&select=dataset_id,metas.default.title&limit=20" 2500
          p "https://data.lillemetropole.fr/api/1/datasets/?q=agenda&page_size=10" 2500
          p "https://data.lillemetropole.fr/api/2/datasets/search/?q=agenda&page_size=10" 1500
      - name: Source nationale OpenAgenda (Opendatasoft public)
        run: |
          set +e
          U='https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda/records?where=lastdate_end%20%3E%3D%20date%272026-09-30%27%20and%20firstdate_begin%20%3C%20date%272026-10-14%27%20and%20within_distance(location_coordinates%2C%20geom%27POINT(3.1%2050.6)%27%2C%2020km)&order_by=firstdate_begin&limit=100&select=uid%2Ctitle_fr%2Cdescription_fr%2Ckeywords_fr%2Cfirstdate_begin%2Clastdate_end%2Clocation_name%2Clocation_city%2Ccanonicalurl'
          curl -sS -m 30 -D h.txt -H "Origin: https://mariebonifacio.github.io" -o b.json -w "HTTP %{http_code} %{content_type} taille %{size_download}\n" "$U"; grep -i "^access-control" h.txt
          python3 -c "import json;d=json.load(open('b.json'));print('total',d.get('total_count'), d.get('error_code'), d.get('message'));[print(r.get('firstdate_begin'),'|',r.get('title_fr'),'|',r.get('location_city'),'|',r.get('canonicalurl')) for r in d.get('results',[])[:8]]"
