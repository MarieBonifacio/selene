name: Compte
# Déploie la fonction Supabase Edge « compte » (suppression du compte depuis l'app, docs/compte.md) : à la demande,
# ou quand elle change sur main. Le jeton Supabase vit dans les secrets chiffrés du dépôt ; sans lui, rien ne part
# (le déploiement automatique est sauté avec un avis, un lancement à la main échoue en le disant).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/compte/**', 'supabase/functions/_shared/**']
concurrency: compte
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pxnrzrmzritezftefdlj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Réglages présents ?
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::notice::Pas de secret SUPABASE_ACCESS_TOKEN (révoqué ?) : déploiement automatique sauté. Pour redéployer : un nouveau jeton, puis Run workflow."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent (Settings → Secrets and variables → Actions)."; exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Outils (versions de package-lock.json)
        if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - name: Tests des fonctions (on ne déploie pas du rouge)
        if: steps.cfg.outputs.ok == 'true'
        run: npm run test:functions
      - uses: supabase/setup-cli@v3
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: 2.118.0 # épinglée : un déploiement ne change pas d’outil selon le jour
      - name: Déployer
        if: steps.cfg.outputs.ok == 'true'
        # --no-verify-jwt : la fonction vérifie elle-même la session auprès de Supabase Auth (nouvelles clés sb_…).
        run: supabase functions deploy compte --project-ref "$PROJECT_REF" --no-verify-jwt
