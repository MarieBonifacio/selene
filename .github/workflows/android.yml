name: Android
# Construit l'APK de Selene (Capacitor, docs/android.md) : la page native (dist/native), synchronisée dans le projet
# native/android, compilée par Gradle. L'APK de débogage est déposé en artefact, à installer à la main (sideload).
# Les runners Ubuntu de GitHub ont déjà le SDK Android.
on:
  pull_request:
    paths: ['src/**', 'native/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'build.py', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['src/**', 'native/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'build.py', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8 et le plugin Android de Gradle demandent Java 21
          cache: gradle
      - run: npm ci
      - name: Page native, puis projet Android synchronisé (page et plugins)
        run: |
          npm run build:dist
          npx cap sync android
      - name: APK de débogage
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      # Le chemin de signature de la publication (release.yml), éprouvé à chaque fois avec une clé jetable :
      # une erreur dans build.gradle se voit ici, pas le jour d'une sortie.
      - name: Version signée (clé jetable)
        working-directory: native/android
        env:
          SELENE_KEYSTORE: ${{ runner.temp }}/jetable.jks
          SELENE_KEYSTORE_PASSWORD: jetable-jetable
          SELENE_KEY_ALIAS: selene
          SELENE_KEY_PASSWORD: jetable-jetable
          SELENE_VERSION_NAME: 0.0.1
          SELENE_VERSION_CODE: '1'
        run: |
          keytool -genkeypair -keystore "$SELENE_KEYSTORE" -storepass "$SELENE_KEYSTORE_PASSWORD" -keypass "$SELENE_KEY_PASSWORD" \
            -alias "$SELENE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Selene CI"
          ./gradlew assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk" | grep -q "CN=Selene CI"
          rm -f "$SELENE_KEYSTORE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selene-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
