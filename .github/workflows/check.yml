name: Check
on:
  # Pas de `push` : une PR était testée deux fois (push + pull_request), et un merge sur main deux fois aussi
  # (ici, puis via pages.yml). main est couvert par pages.yml ; les branches, par leur pull request.
  pull_request:
  workflow_dispatch:
  workflow_call: # réutilisé par pages.yml : pas de déploiement sans tests verts
concurrency:
  # Un nouveau push sur la même branche annule l'exécution devenue inutile ; jamais celle de main.
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Outils aux versions de package-lock.json : la même chaîne en local et en CI.
      - run: npm ci
      - run: npm run build:check
      - run: npm test
      - run: npm run test:syntax
      - name: Analyse statique (script assemblé + service worker)
        run: npm run lint
      - name: Traductions (textes marqués, dictionnaires)
        run: npm run i18n
      # Le banc (tests/bench.js, BL-09) : chaque vue sous 150 ms dans la VM, sur un historique de plusieurs années.
      - name: Banc de mesure (150 ms par vue au plus)
        run: npm run bench
  recette:
    # Le cahier de recette (docs/recette) dit-il encore vrai ? `npm run recette` confronte ses cas, son inventaire et sa
    # matrice aux tests, aux liens et aux jeux de données du dépôt : quelques secondes, sans réseau, sans navigateur et
    # sans `npm ci` (le script n'importe que du code du dépôt). Un job à part : un cahier en retard se lit seul, il ne
    # masque pas un code cassé et n'en est pas un. Sur les pull requests et à la demande de *Check* ; jamais quand
    # pages.yml appelle ce workflow (`github.workflow` y est « Pages ») : un cahier en retard ne doit pas empêcher de
    # publier le site. Rendre ce job obligatoire (ou non) pour fusionner est un réglage de protection de branche.
    if: github.event_name == 'pull_request' || github.workflow == 'Check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Cahier de recette (cohérence avec les tests, les liens, les jeux de données)
        run: npm run recette
  passeur:
    # Les fonctions Supabase Edge (passeur, assistant : docs/passeur.md, docs/assistant.md) : types et tests, avec Deno.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:functions
  browser:
    # Parcours dans un vrai navigateur (tests/browser) : ce que le faux DOM des tests unitaires ne voit pas.
    # WebKit : le moteur de Safari, des WebView iOS et de Tauri sous macOS et Linux ; Chromium : celui de Chrome,
    # d'Android et de Tauri sous Windows (WebView2) ; Firefox (Gecko), sur ordinateur (BL-13).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # un moteur en échec n'interrompt pas les autres : on veut chaque verdict
      matrix:
        browser: [chromium, webkit, firefox]
    name: browser (${{ matrix.browser }})
    env:
      SELENE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - name: Navigateur (en cache tant que package-lock.json, donc la version de Playwright, ne change pas)
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}-${{ runner.os }}
      - name: Télécharger le navigateur
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Bibliothèques système du navigateur
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      # Firefox, ajouté le 6 octobre 2026 : non bloquant jusqu'au 20 octobre, le temps de repérer ce qui échoue pour une
      # raison propre au moteur ; ses échecs restent dans le journal et en avertissement. Ensuite, retirer cette ligne.
      - run: npm run test:browser
        continue-on-error: ${{ matrix.browser == 'firefox' }}
