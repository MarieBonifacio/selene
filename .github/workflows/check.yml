name: Check
on:
  push:
  pull_request:
  workflow_call: # réutilisé par pages.yml : pas de déploiement sans tests verts
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Outils aux versions de package-lock.json : la même chaîne en local et en CI.
      - run: npm ci
      - run: npm run build:check
      - run: npm test
      - run: npm run test:syntax
      - name: Analyse statique (script assemblé + service worker)
        run: npm run lint
  passeur:
    # La fonction Supabase Edge (supabase/functions/passeur, docs/passeur.md) : types et tests, avec Deno.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:passeur
  browser:
    # Parcours dans un vrai Chromium (tests/browser) : ce que le faux DOM des tests unitaires ne voit pas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - name: Chromium (version liée à Playwright, épinglé dans package-lock.json)
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
