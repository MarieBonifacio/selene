name: Check
on:
  # Pas de `push` : une PR était testée deux fois (push + pull_request), et un merge sur main deux fois aussi
  # (ici, puis via pages.yml). main est couvert par pages.yml ; les branches, par leur pull request.
  pull_request:
  workflow_dispatch:
  workflow_call: # réutilisé par pages.yml : pas de déploiement sans tests verts
concurrency:
  # Un nouveau push sur la même branche annule l'exécution devenue inutile ; jamais celle de main.
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python3 build.py --check
      - run: node --test tests/*.test.js
      - run: for f in src/*.js; do node --check "$f"; done
      - name: Analyse statique (script assemblé + service worker)
        run: |
          python3 build.py --bundle .lint/selene.js
          npx --yes eslint@10.11.0 .lint/selene.js sw.js
  passeur:
    # La fonction Supabase Edge (supabase/functions/passeur, docs/passeur.md) : types et tests, avec Deno.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npx --yes deno@2.9.6 check supabase/functions/passeur/index.ts
      - run: npx --yes deno@2.9.6 test supabase/functions/passeur/
  browser:
    # Parcours dans un vrai Chromium (tests/browser) : ce que le faux DOM des tests unitaires ne voit pas.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python3 build.py --check
      - name: Playwright (version épinglée)
        run: npm i --no-save --no-package-lock playwright@1.56.1
      - name: Chromium (en cache tant que la version de Playwright ne change pas)
        id: chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - name: Télécharger Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Bibliothèques système de Chromium
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node tests/browser/run.js
