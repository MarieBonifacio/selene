name: iOS
# Compile l'app iOS de Selene (Capacitor, docs/ios.md) pour le simulateur, sans signature : la preuve que le projet
# native/ios et ses plugins (Swift Package Manager) se construisent. L'installer sur un iPhone demande un compte Apple
# Developer (signature, TestFlight) : phase de publication. Les runners macOS de GitHub ont Xcode.
on:
  pull_request:
    paths: ['src/**', 'native/ios/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'build.py', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['src/**', 'native/ios/**', 'capacitor.config.json', 'package.json', 'package-lock.json', 'build.py', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Page native, puis projet iOS synchronisé (page et plugins)
        run: |
          npm run build:dist
          npx cap sync ios
      - name: Compilation (simulateur, sans signature)
        working-directory: native/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # Le manifeste de confidentialité (docs/ios.md) doit être dans l'app, et lisible : sans lui, App Store Connect
      # refuse l'envoi (ITMS-91053, raison manquante pour les dates de fichiers).
      - name: Manifeste de confidentialité dans l'app
        working-directory: native/ios/App
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name App.app -type d | head -1)
          test -n "$app" && plutil -lint "$app/PrivacyInfo.xcprivacy"
