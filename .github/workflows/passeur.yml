name: Passeur
# Déploie la fonction Supabase Edge « passeur » (docs/passeur.md) : à la demande, ou quand elle change sur main.
# Le jeton Supabase vit dans les secrets chiffrés du dépôt (jamais dans le code, jamais dans un journal) ;
# les comptes autorisés, dans une variable du dépôt. Sans l'un ou l'autre, rien ne part.
# Un jeton personnel Supabase n'est pas restreint à un projet : le révoquer (et retirer le secret) entre deux
# déploiements est permis. Le déploiement automatique est alors sauté, avec un avis (main reste vert) ;
# un lancement à la main, lui, échoue en le disant.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/passeur/**', 'supabase/functions/_shared/**']
concurrency: passeur # deux déploiements à la fois : non
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PASSEUR_USERS: ${{ vars.PASSEUR_USERS }}
      PROJECT_REF: pxnrzrmzritezftefdlj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Réglages présents ?
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::notice::Pas de secret SUPABASE_ACCESS_TOKEN (révoqué ?) : déploiement automatique sauté. Pour redéployer : un nouveau jeton, puis Run workflow."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent (Settings → Secrets and variables → Actions)."; exit 1
          fi
          echo "$PASSEUR_USERS" | grep -Eq '^[0-9a-fA-F-]{36}(,[0-9a-fA-F-]{36})*$' || { echo "::error::Variable PASSEUR_USERS absente ou mal formée (identifiant de Réglages → Passeur)."; exit 1; }
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Outils (versions de package-lock.json)
        if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - name: Tests du passeur (on ne déploie pas du rouge)
        if: steps.cfg.outputs.ok == 'true'
        run: npm run test:functions
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: 2.118.0 # épinglée : un déploiement ne change pas d’outil selon le jour
      - name: Comptes autorisés
        if: steps.cfg.outputs.ok == 'true'
        run: supabase secrets set --project-ref "$PROJECT_REF" PASSEUR_USERS="$PASSEUR_USERS"
      - name: Déployer
        if: steps.cfg.outputs.ok == 'true'
        # --no-verify-jwt : la fonction vérifie elle-même la session auprès de Supabase Auth (nouvelles clés sb_…).
        run: supabase functions deploy passeur --project-ref "$PROJECT_REF" --no-verify-jwt
