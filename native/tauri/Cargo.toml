[package]
name = "selene"
version = "0.1.0"
description = "Selene, l'app de bureau (Tauri) : docs/desktop.md"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
serde_json = "1"
keyring = "=4.2.0"
tauri-plugin-single-instance = { version = "=2.5.0", features = ["deep-link"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-deep-link = "=2.5.0"
