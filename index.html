<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Selene">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1310" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e2e6de" media="(prefers-color-scheme: light)">
<title>Selene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e2e6de; --surface:#edf0e9; --ink:#1a211b; --muted:#5b6859; --rule:#c1c9bc; --alarm:#a8431f; --ok:#3d7a52;
  --moon:#f4f1e4; --moon-shadow:#b8c2b6; --glow:rgba(255,252,235,.0);
  --sky-top:#b9c7c0; --sky-bot:#dfe5dc; --tree-far:#8fa294; --tree-near:#3b4d40; --mist:rgba(226,230,222,.75); --star:0;
  --acc-l:#3d6a45; --acc-d:#8fbf86; --accent:var(--acc-l);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-palette="albedo"]{--acc-l:#5a6a5c;--acc-d:#bccab8}
:root[data-palette="citrinitas"]{--acc-l:#83631a;--acc-d:#d4a94c}
:root[data-palette="rubedo"]{--acc-l:#973a30;--acc-d:#d56455}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0e1310; --surface:#151c17; --ink:#dde2d6; --muted:#8c998a; --rule:#243029; --alarm:#ff8a55; --ok:#7cc493;
    --moon:#ece8d6; --moon-shadow:#1c2620; --glow:rgba(236,232,214,.16);
    --sky-top:#070b10; --sky-bot:#132019; --tree-far:#1d2b23; --tree-near:#0a0f0c; --mist:rgba(40,58,48,.55); --star:.8;
    --accent:var(--acc-d);
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#0e1310; --surface:#151c17; --ink:#dde2d6; --muted:#8c998a; --rule:#243029; --alarm:#ff8a55; --ok:#7cc493;
    --moon:#ece8d6; --moon-shadow:#1c2620; --glow:rgba(236,232,214,.16);
    --sky-top:#070b10; --sky-bot:#132019; --tree-far:#1d2b23; --tree-near:#0a0f0c; --mist:rgba(40,58,48,.55); --star:.8;
    --accent:var(--acc-d);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Spectral",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:22px 20px 90px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.05;margin:0}
h2{font-size:1.9rem;margin-bottom:6px}
h3{font-size:1.35rem;margin-bottom:4px}
.hint{color:var(--muted);font-style:italic;font-size:.93rem;margin:0 0 14px}
section{margin-bottom:40px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand h1{font-size:2.1rem;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.85rem;font-family:"Spectral",serif}
.timer{display:flex;align-items:center;gap:8px}
.clock{font-variant-numeric:tabular-nums;font-weight:600;min-width:4.4ch;text-align:right}
.clock.done{color:var(--ok)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:16px -20px 28px;padding:0 20px;border-bottom:1px solid var(--rule);scrollbar-width:none}
nav.tabs a{white-space:nowrap;text-decoration:none;padding:9px 12px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;padding:7px 14px;border-radius:2px;font-weight:500}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ghost{border-color:transparent;color:var(--muted);padding:5px 8px}
.btn.sm{padding:3px 9px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* hero */
.hero{position:relative;margin:-6px -20px 44px;overflow:hidden;border-bottom:1px solid var(--rule)}
.hero svg.scene{display:block;width:100%;height:clamp(240px,36vw,340px)}
.hero .txt{position:absolute;left:20px;top:clamp(18px,4vw,40px);max-width:min(52%,420px)}
.hero .phase{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,6vw,3.4rem);line-height:1;color:var(--ink)}
.hero p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
:root:not([data-mode="light"]) .hero .phase{text-shadow:0 1px 12px var(--bg)}
@media (max-width:520px){.hero .txt{max-width:62%}}

/* lists */
ul.plain{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--rule)}
ul.plain>.item:last-child{border-bottom:1px solid var(--rule)}
.check{appearance:none;width:21px;height:21px;border:1.5px solid var(--ink);border-radius:50%;margin:3px 0 0;display:grid;place-content:center;cursor:pointer;background:transparent}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:9px;height:5px;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.t-title{font-weight:500;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.done .t-title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;font-size:.85rem;color:var(--muted)}
.tag{color:var(--accent);font-weight:500}
.late{color:var(--alarm);font-weight:600}
.soon{color:var(--accent);font-weight:600}
.star{background:none;border:0;font-size:1.1rem;line-height:1;padding:2px 4px;color:var(--rule)}
.star.on{color:var(--accent)}
.details{grid-column:2 / 4;font-size:.93rem;display:none}
.open .details{display:block}
.steps{list-style:none;padding:0;margin:6px 0}
.steps li{display:flex;gap:8px;align-items:center;padding:2px 0}
.steps input{accent-color:var(--accent);width:16px;height:16px}
.note{color:var(--muted);white-space:pre-wrap;margin:6px 0}

/* overview rows */
.over{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:6px 18px;align-items:baseline;padding:12px 0;border-top:1px solid var(--rule);text-decoration:none}
.over:last-child{border-bottom:1px solid var(--rule)}
.over b{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:600}
.over span{color:var(--muted)}
@media (max-width:560px){.over{grid-template-columns:1fr auto}.over span{grid-column:1 / 3}}

/* progress */
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.big{font-family:"Cormorant Garamond",serif;font-size:2.6rem;line-height:1}

/* grids */
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.room{border:1px solid var(--rule);background:var(--surface);padding:10px;position:relative;overflow:hidden;text-align:left;min-height:84px}
.room .fill{position:absolute;left:0;bottom:0;width:100%;background:var(--accent);opacity:.18}
.room *{position:relative}
.room b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.8rem;line-height:1.1}
.room small{color:var(--muted)}
.room.active{outline:2px solid var(--accent);outline-offset:-2px}

/* kundalini calendar */
.cal{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;max-width:420px;font-size:.78rem;color:var(--muted);align-items:center}
.cal i{display:block;aspect-ratio:1;border-radius:50%;border:1px solid var(--rule)}
.cal i.on{background:var(--accent);border-color:var(--accent)}
.cal i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.cal i.future{opacity:.35}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col h3{font-size:1.2rem;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--rule);padding:10px;margin-bottom:8px}
.card p{margin:4px 0;font-size:.9rem;color:var(--muted);white-space:pre-wrap}

/* forms */
dialog{border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:0;width:min(560px,94vw);border-radius:3px}
dialog::backdrop{background:rgba(10,8,14,.6)}
dialog form{padding:22px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.88rem;font-weight:500}
input,select,textarea{background:var(--bg);border:1px solid var(--rule);padding:8px;border-radius:2px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.field-row{grid-template-columns:1fr}}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);padding:8px 12px;cursor:pointer;background:var(--surface)}
.swatch.on{border-color:var(--accent);outline:1px solid var(--accent)}
.swatch i{width:14px;height:14px;border-radius:50%;display:block}
.capture{display:flex;gap:8px}
.capture input{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;font-size:.92rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.saving{font-size:.78rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.room.over .fill{background:var(--alarm);opacity:.25}.room.over b{color:var(--alarm)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 22px}.stats div span{display:block;color:var(--muted);font-size:.85rem}
.pos{color:var(--ok)}.neg{color:var(--alarm)}
.chat{display:flex;flex-direction:column;gap:14px;margin:12px 0 18px}
.msg{max-width:78ch;padding:12px 14px;border:1px solid var(--rule);background:var(--surface);border-radius:2px;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:transparent;border-style:dashed}
.msg.claude{border-left:3px solid var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.status{font-size:.88rem;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;margin:6px 0 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#accueil"><div id="miniMoon"></div><div><h1 id="brandName">Selene</h1><small id="dateline"></small></div></a>
    <div class="timer">
      <span class="saving" id="saving"></span>
      <span class="clock" id="clock">15:00</span>
      <button class="btn sm" id="timerBtn">Lancer 15 min</button>
      <button class="btn ghost sm" id="timerReset" aria-label="Réinitialiser le minuteur">↺</button>
    </div>
  </header>
  <nav class="tabs" id="nav"></nav>
  <main id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<dialog id="cdlg"><form method="dialog" style="padding:22px;display:grid;gap:14px"><p id="cmsg" style="margin:0"></p><div class="row"><button class="btn solid" value="ok">Confirmer</button><button class="btn" value="cancel">Annuler</button></div></form></dialog>
<datalist id="roomList"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
/* ================= fusion à trois voies (pure : ni DOM ni stockage) =================
   base   = dernier état connu commun avec le serveur (ce qu'on a lu ou écrit en dernier)
   local  = état de cet appareil ; remote = état actuel du serveur.
   Un côté qui n'a pas bougé par rapport à la base cède la place à l'autre. Si les deux
   ont bougé : les objets fusionnent clé par clé, les listes d'objets à `id` entrée par
   entrée (ajouts des deux côtés conservés, suppression appliquée seulement si l'autre
   côté n'a pas modifié l'entrée), et pour une simple valeur le plus récent gagne
   (`preferLocal`, décidé une fois pour tout le document d'après updatedAt). */
const isRecord = v => v !== null && typeof v === "object" && !Array.isArray(v);
function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b || a === null || b === null || typeof a !== "object") return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) return a.length === b.length && a.every((x, i) => deepEqual(x, b[i]));
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => Object.hasOwn(b, k) && deepEqual(a[k], b[k]));
}
const idList = v => Array.isArray(v) && v.every(x => isRecord(x) && typeof x.id === "string");

// Fusionne deux collections indexées (clés d'objet ou ids de liste) ; renvoie les paires [clé, valeur] gardées.
function mergeEntries(keys, get, base, local, remote, preferLocal) {
  const out = [];
  for (const k of keys) {
    const inB = get.has(base, k), inL = get.has(local, k), inR = get.has(remote, k);
    const b = inB ? get.at(base, k) : undefined;
    if (inL && inR) out.push([k, merge3(b, get.at(local, k), get.at(remote, k), preferLocal)]);
    else if (inL) { if (!(inB && deepEqual(b, get.at(local, k)))) out.push([k, get.at(local, k)]); } // supprimé à distance, sauf si modifié ici
    else if (inR) { if (!(inB && deepEqual(b, get.at(remote, k)))) out.push([k, get.at(remote, k)]); }
  }
  return out;
}
const objAccess = { has: (o, k) => isRecord(o) && Object.hasOwn(o, k), at: (o, k) => o[k] };
const listAccess = { has: (l, k) => Array.isArray(l) && l.some(x => x && x.id === k), at: (l, k) => l.find(x => x.id === k) };

function merge3(base, local, remote, preferLocal) {
  if (deepEqual(local, remote)) return local;
  if (base !== undefined && deepEqual(base, local)) return remote;
  if (base !== undefined && deepEqual(base, remote)) return local;
  if (isRecord(local) && isRecord(remote)) {
    const keys = [...new Set([...Object.keys(remote), ...Object.keys(local), ...(isRecord(base) ? Object.keys(base) : [])])];
    return Object.fromEntries(mergeEntries(keys, objAccess, base, local, remote, preferLocal));
  }
  if (idList(local) && idList(remote)) {
    // Ordre : celui du serveur, puis les ajouts locaux dans leur ordre d'origine.
    const ids = [...new Set([...remote.map(x => x.id), ...local.map(x => x.id), ...(idList(base) ? base.map(x => x.id) : [])])];
    return mergeEntries(ids, listAccess, idList(base) ? base : undefined, local, remote, preferLocal).map(([, v]) => v);
  }
  return preferLocal ? local : remote;
}
/* Point d'entrée pour un document entier. Sans base (premier contact de cet appareil) :
   un appareil vierge (updatedAt nul, jamais modifié) adopte le serveur tel quel, sinon
   on fusionne sans rien supprimer — mieux vaut une entrée ressuscitée qu'une entrée perdue. */
function mergeDocs(base, local, remote) {
  if (!remote) return local;
  if (!base && !local.updatedAt) return remote;
  return merge3(base || undefined, local, remote, (local.updatedAt || 0) >= (remote.updatedAt || 0));
}

/* Un store = un document JSON gardé dans localStorage (source de vérité locale) et,
   une fois connecté, synchronisé avec une base distante par lecture → fusion à trois
   voies → écriture conditionnelle. La « base » (dernier état commun connu avec le
   serveur) est gardée à côté, sous `${key}-base` : c'est elle qui permet de savoir qui
   a modifié quoi, donc de ne rien écraser.
   Contrat de `db.doc(path)` : get() → {exists, data()} ; onSnapshot(cb, err) → désabonnement ;
   et soit replace(value, attendu, {keepalive}) → booléen (écriture conditionnelle, false = le
   serveur a changé entre-temps), soit à défaut set(value) (écriture inconditionnelle).
   `normalize(doc)` remet un document dans la forme attendue ; il est appliqué à tout ce qui entre
   dans le store (lecture locale, synchro, import, réinitialisation), jamais à la lecture. */
function makeStore(key, path, seed, normalize = d => d) {
  const BASE = key + "-base";
  const read = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
  const s = { db: null, timer: null, unsub: null, syncing: null, again: false, key };
  s.data = normalize(read(key) || seed());
  // Une migration faite au chargement est écrite aussitôt : sinon, sans synchro (artefact, hors ligne),
  // chaque chargement la referait depuis l'ancienne forme (et, pour le board, reverserait des tâches supprimées).
  try { const raw = localStorage.getItem(key); if (raw && raw !== JSON.stringify(s.data)) localStorage.setItem(key, JSON.stringify(s.data)); } catch {}
  s.base = read(BASE);
  const saveLS = () => { try { localStorage.setItem(key, JSON.stringify(s.data)); } catch {} };
  const saveBase = () => { try { if (s.base) localStorage.setItem(BASE, JSON.stringify(s.base)); else localStorage.removeItem(BASE); } catch {} };
  const write = (doc, value, expected, opts) => doc.replace ? doc.replace(value, expected, opts) : doc.set(value).then(() => true);

  async function syncOnce(db, prefetched) {
    const doc = db.doc(path);
    for (let attempt = 0; attempt < 3; attempt++) {
      const snap = prefetched || await doc.get();
      prefetched = null;
      if (s.db !== db) return; // déconnecté pendant l'attente (déconnexion, changement de compte)
      const remote = snap.exists ? snap.data() : null, local = clone(s.data), force = s.force;
      if (remote && (remote.schemaVersion || 0) > SCHEMA_VERSION) throw Object.assign(new Error("Données au format plus récent"), { stale: true });
      let merged = force ? local : mergeDocs(s.base, local, remote); // import de sauvegarde : on remplace, on ne fusionne pas
      if (remote && deepEqual({ ...merged, updatedAt: 0 }, { ...remote, updatedAt: 0 })) merged = remote; // rien de neuf à envoyer
      else {
        merged = { ...merged, updatedAt: Math.max(Date.now(), ((remote && remote.updatedAt) || 0) + 1) };
        const ok = await write(doc, clone(merged), remote ? remote.updatedAt : null);
        if (s.db !== db) return;
        if (!ok) continue; // un autre appareil a écrit entre notre lecture et notre écriture : on relit
      }
      if (force) s.force = false;
      s.base = clone(merged); saveBase();
      // Ce que l'utilisatrice a modifié pendant l'aller-retour réseau est refusionné par-dessus.
      const next = normalize(deepEqual(s.data, local) ? clone(merged) : mergeDocs(local, s.data, merged));
      if (!deepEqual(next, merged)) s.again = true;
      const changed = !deepEqual(next, s.data);
      s.data = next; saveLS();
      if (changed) render();
      return;
    }
    throw new Error("Conflit d'écriture persistant");
  }
  /* Une seule synchro à la fois par store ; une demande pendant qu'une autre tourne la relance à la fin.
     Résout à true si tout est à jour, false si on est resté en local. */
  s.sync = prefetched => {
    const db = s.db;
    if (!db) return Promise.resolve(false);
    if (s.syncing) { s.again = true; return s.syncing; }
    s.syncing = (async () => {
      try {
        do { s.again = false; await syncOnce(db, prefetched); prefetched = null; } while (s.again && s.db === db);
        setSaving("");
        return true;
      } catch (e) {
        setSaving(e.stale ? "Selene a été mise à jour sur un autre appareil : recharge la page pour synchroniser"
          : "Non synchronisé — enregistré sur cet appareil seulement");
        return false;
      } finally { s.syncing = null; }
    })();
    return s.syncing;
  };
  s.save = () => {
    s.data.updatedAt = Date.now(); saveLS();
    if (!s.db) return;
    setSaving("Enregistrement…"); clearTimeout(s.timer);
    s.timer = setTimeout(() => { s.timer = null; s.sync(); }, 900);
  };

function moveMod(el, d) { const ms = S().config.modules, i = +el.closest("[data-i]").dataset.i, j = i + d; if (j < 0 || j >= ms.length) return; [ms[i], ms[j]] = [ms[j], ms[i]]; site.save(); render(); }
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (a && CLICK[a.dataset.act] && a.tagName !== "SELECT" && !(a.tagName === "INPUT" && a.type !== "button")) CLICK[a.dataset.act](a); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "capIn") capture(); if (e.key === "Enter" && e.target.id === "noteIn") CLICK["note-add"](e.target); if (e.key === "Enter" && !e.shiftKey && e.target.id === "chatIn") { e.preventDefault(); sendChat(e.target.value); } });
const CHANGE = {}; // actions « change » des types de module (remplie par types.js)
document.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act;
  if (act && Object.hasOwn(CHANGE, act)) CHANGE[act](el);
  else if (act && act.startsWith("grp-") && act !== "grp-filter") {
    const mod = el.closest("[data-mod]").dataset.mod, g = gcfg(mod), G = grouperFor(mod);
    if (act === "grp-on") g.on = el.checked;
    else if (act === "grp-by") { g.by = el.value; gFilter[mod] = ""; }
    else if (act === "grp-sort") g.sort = el.value;
    else if (act === "grp-hide") g.hideDone = el.checked;
    else if (act === "grp-title") g.title = el.value.trim();
    else if (act === "grp-rename") {
      const from = el.dataset.old, to = el.value.trim(); if (!to || to === from) return;
      const by = groupBy(mod); G.items().forEach(it => { if (it[by] === from) it[by] = to; });
      if (G.rename) G.rename(from, to); // ex. une enveloppe du budget porte le nom du groupe
      if (gFilter[mod] === from) gFilter[mod] = to;
      if (taskFilters[mod] && taskFilters[mod].room === from) taskFilters[mod].room = to;
      G.store().save(); toast(`« ${from} » s'appelle désormais « ${to} ».`);
    }
    site.save(); el.blur(); render();
  }
  else if (act === "as-key") { const v = el.value.trim(); if (v && !v.startsWith("•")) { try { localStorage.setItem("selene-api-key", v); } catch {} toast(hosted() ? "Clé enregistrée dans ce navigateur." : "Clé enregistrée. Elle servira une fois le site hébergé."); } el.blur(); render(); }
  else if (act === "as-model") { S().config.assistant.model = el.value; site.save(); render(); }
  else if (act === "as-actions") { S().config.assistant.actions = el.checked; site.save(); render(); }
  else if (act === "as-share") { S().config.assistant.share[el.dataset.k] = el.checked; site.save(); render(); }
  else if (act === "imp") {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then(async t => { const d = parseBackup(t); if (!await ask("Remplacer tout l'état actuel par celui du fichier ?")) return; site.replaceAll(d.site); board.replaceAll(d.board); /* le site d'abord : les tâches d'une ancienne sauvegarde y sont versées */ render(); toast("Sauvegarde importée."); }).catch(() => toast("Fichier illisible ou pas une sauvegarde Selene.")).finally(() => { el.value = ""; });
  }
  else if (act === "mod-on") { S().config.modules[+el.closest("[data-i]").dataset.i].on = el.checked; site.save(); render(); }
  else if (act === "mod-label") {
    const s = S(), m = s.config.modules[+el.closest("[data-i]").dataset.i], v = el.value.trim();
    if (s.modules[m.id]) { s.modules[m.id].label = v || s.modules[m.id].label; }
    else if (v && v !== MODULE_DEFS[m.id]) s.config.labels[m.id] = v; else delete s.config.labels[m.id];
    site.save(); render();
  }
  else if (el.dataset.setMod) {
    // « id.champ » ou « id.groupe.champ » ; jamais un chemin vers le prototype des objets.
    const [id, ...path] = el.dataset.setMod.split("."), f = path.pop();
    if ([...path, f].some(k => k === "__proto__" || k === "constructor" || k === "prototype")) return;
    const cfg = path.reduce((o, k) => o[k], S().modules[id].config);
    let v = el.value; if (el.type === "number") v = Math.max(1, +v || 1); if (el.type === "date") v = v || null;
    if (el.required && !String(v).trim()) { el.blur(); return render(); } // champ obligatoire vidé : on garde l'ancienne valeur
    cfg[f] = v; site.save(); el.blur(); render();
  }
  else if (el.dataset.set) {
    const [k, f] = el.dataset.set.split("."), s = S();
    let v = el.value; if (el.type === "number") v = Math.max(1, +v || 1); if (el.type === "date") v = v || null;
    s[k][f] = v; site.save(); el.blur(); render();
  }
});

/* ================= timer ================= */
let left = 900, tick = null, endAt = 0;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
function tickTimer() {
  left = Math.max(0, Math.round((endAt - Date.now()) / 1000)); $("#clock").textContent = mmss(left);
  if (left <= 0) { clearInterval(tick); tick = null; $("#clock").classList.add("done"); $("#timerBtn").textContent = "Relancer"; toast("Quinze minutes. Tu as le droit d'arrêter. Et celui de continuer."); try { navigator.vibrate && navigator.vibrate(200); } catch {} }
}
$("#timerBtn").addEventListener("click", () => {
  const b = $("#timerBtn");
  if (tick) { clearInterval(tick); tick = null; b.textContent = "Reprendre"; return; }
  if (left === 0) left = 900; endAt = Date.now() + left * 1000; $("#clock").classList.remove("done"); b.textContent = "Pause";
  tick = setInterval(tickTimer, 500);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && tick) tickTimer(); });
$("#timerReset").addEventListener("click", () => { clearInterval(tick); tick = null; left = 900; $("#clock").textContent = mmss(left); $("#clock").classList.remove("done"); $("#timerBtn").textContent = "Lancer 15 min"; });


/* ================= registre des types de module : la partie interface =================
   Un type = une entrée dans MODULE_TYPES (domain.js : défauts, forme des entrées, validation)
   + une entrée ici. Rien d'autre à toucher : le rendu, l'accueil, les réglages, l'assistant et
   les actions passent tous par ces deux registres.
     view(id)              écran du module
     settings(id, inst)    champs du bloc « Réglages par module »
     summary(id, inst)     ligne de l'accueil « Où en sont les choses » (HTML)
     alerts(id, inst, now) rappels du bloc « Aujourd'hui » : [{ text (HTML), href? , quick? }]
     context(inst, name)   paragraphe envoyé à l'assistant (texte brut)
     add(id, inst)         bouton « noter / ajouter » (data-act="entry-add")
     accept(id, inst, note) recevoir une note triée depuis un module Notes ; canAccept(inst) pour conditionner
     badge(inst)           nombre affiché à côté du nom dans la navigation
     click / change        actions propres au type, fusionnées dans CLICK / CHANGE */

const lastOf = (inst, type) => inst.entries.filter(x => x.type === type).map(x => x.date).sort().pop();

const plural = (n, word) => `${n} ${word}${n > 1 ? "s" : ""}`;

function programmeGroupPanel(id) {
  const inst = S().modules[id], c = inst.config, now = todayISO();
  const days = new Set(inst.entries.map(x => x.date)), cur = Math.min(52, +c.weeks || 12, Math.floor(diffDays(now, c.start) / 7) + 1), out = [];
  for (let w = 0; w < cur; w++) { let n = 0; for (let d = 0; d < 7; d++) if (days.has(addDaysTo(c.start, w * 7 + d))) n++; const den = +c.perWeek || 1; out.push({ name: `Semaine ${w + 1}`, pct: Math.min(100, Math.round(100 * n / den)), sub: `${n} sur ${den} séances` }); }
  return `<section><h3 style="margin:0 0 4px">Par semaine</h3><p class="hint">Objectif : ${esc(c.perWeek)} séances par semaine, réglable dans Réglages.</p>
    <div class="rooms">${out.map(g => `<div class="room ${g.pct > 100 ? "over" : ""}"><div class="fill" style="height:${Math.min(100, g.pct)}%"></div><small>${esc(g.name)}</small><b>${g.pct} %</b><small>${esc(g.sub)}</small></div>`).join("") || `<p class="empty">Rien à regrouper pour l'instant.</p>`}</div></section>`;
}
function cumulGroupPanel(id) {
  const inst = S().modules[id], c = inst.config;
  const sum = catId => inst.entries.filter(x => (x.category || "") === catId).reduce((a, x) => a + (+x.value || 0), 0);
  const out = c.categories.map(cat => { const v = sum(cat.id), g = +cat.goal || 0; return { name: cat.name || "Sans titre", pct: g ? Math.min(100, Math.round(100 * v / g)) : null, sub: g ? `${v.toLocaleString("fr-FR")} / ${g.toLocaleString("fr-FR")} ${c.unitLabel}` : `${v.toLocaleString("fr-FR")} ${c.unitLabel}` }; });
  const loose = sum(""); if (loose && c.categories.length) out.push({ name: `Hors ${c.categoryLabel.toLowerCase()}`, pct: null, sub: `${loose.toLocaleString("fr-FR")} ${c.unitLabel}` });
  return `<section><h3 style="margin:0 0 4px">Par ${esc(c.categoryLabel).toLowerCase()}</h3><p class="hint">Chaque ${esc(c.categoryLabel).toLowerCase()} a son propre objectif.</p>
    <div class="rooms">${out.map(g => `<div class="room"><div class="fill" style="height:${Math.min(100, g.pct ?? 0)}%"></div><small>${esc(g.name)}</small><b>${g.pct == null ? "—" : g.pct + " %"}</b><small>${esc(g.sub)}</small></div>`).join("")}</div></section>`;
}

  ], t ? { ...t, effort: String(t.effort), steps: (t.steps || []).map(x => x.t).join("\n") } : { room: tf(id).room || (gcfg(id).by === "room" ? gFilter[id] || "" : ""), cat: c.cats[0], effort: "1" }, v => {
    const inst = S().modules[id]; // relu : une synchro a pu remplacer les données pendant la saisie

    const data = { title: v.title, room: v.room, cat: v.cat, due: v.due || null, effort: +v.effort, cost: "cost" in v ? (v.cost ? +v.cost : null) : (t ? t.cost : null), note: v.note }; // champ absent (coûts désactivés) ≠ champ vidé

  });
}
/* Tirage au sort : dans un module (sa page) ou parmi tous (accueil), plafond de trois respecté. */
function pickTask(only) {
  if (todayTasks().length >= 3) return toast("Aujourd'hui est plein. Le hasard respecte les plafonds.");
  const o = allTasks().filter(([m, t]) => !t.done && !t.today && (!only || m === only));
  if (!o.length) return toast("Rien à tirer.");
  const small = o.filter(([, t]) => t.effort === 1), pool = (small.length ? small : o).sort(([, a], [, b]) => byDue(a, b)).slice(0, 5);
  const [id, t] = pool[Math.floor(Math.random() * pool.length)];
  setTaskToday(S().modules[id].entries, t.id, true, todayElsewhere(id)); site.save(); render();
  toast(`Le sort a désigné : « ${t.title} ». Pas de recours possible.`);
}

// Les actions propres à chaque type rejoignent les tables d'actions globales (un nom en double serait un bug).
for (const [type, ui] of Object.entries(TYPE_UI)) for (const [table, acts] of [[CLICK, ui.click], [CHANGE, ui.change]]) for (const [act, fn] of Object.entries(acts || {})) {
  if (Object.hasOwn(table, act)) throw new Error(`Action « ${act} » du type ${type} déjà définie`);
  table[act] = fn;
}

function contextText() {
  const s = S(), sh = s.config.assistant.share, now = todayISO(), m = moon(), L = [];
  L.push(`Date : ${fmt(now, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}. Lune : ${m.name.toLowerCase()}, éclairée à ${Math.round(m.illum * 100)} %.`);
  for (const [id, inst] of Object.entries(s.modules)) {
    if (!sh[id] || !enabled(id)) continue;
    L.push(TYPE_UI[inst.type].context(inst, label(id).toUpperCase()));
  }
  return L.join("\n").slice(0, 14000);
}
function instructions() {
  const name = S().config.name || "Selene", permitted = availableTools();
  return `Tu es Claude, intégré au tableau de bord personnel de ${name}. Réponds en français, en prose, sans listes à puces sauf demande. Ton : lucide, cynique, humour noir glissé naturellement ; jamais de morale non demandée ni de justifications répétées. Chaque fois que tu emploies un terme technique ou savant, définis-le brièvement dans la phrase. Sois concis. Tu ne connais que les données ci-dessous, qu'elle a choisi de partager ; tu n'as aucun souvenir d'autres conversations.
${permitted.length ? "Tu peux agir uniquement avec les outils fournis. Ne les utilise que si c'est demandé ou clairement voulu, et dis ce que tu as fait." : "Tu ne peux rien modifier : conseille seulement."}

DONNÉES DU TABLEAU DE BORD
${contextText()}`;
}
const TOOLS = [
  { name: "ajouter_tache", module: () => firstOfType("taches"), description: "Ajoute une tâche au premier module de tâches (voir ses types dans les données). Renvoie une confirmation.", inputSchema: { type: "object", properties: { titre: { type: "string" }, piece: { type: "string", description: "pièce ou lieu" }, echeance: { type: "string", description: "AAAA-MM-JJ" }, type: { type: "string" } }, required: ["titre"] },
    execute(i) { const inst = S().modules[firstOfType("taches")]; const t = addTask(inst.entries, { title: i.titre, room: i.piece, cat: i.type || inst.config.cats[0], due: i.echeance, note: "Ajoutée par l'assistant" }, uid(), todayISO()); site.save(); render(); return `Tâche ajoutée : ${t.title}`; } },
  { name: "terminer_tache", module: () => firstOfType("taches"), description: "Marque comme faite une tâche, par son identifiant entre crochets.", inputSchema: { type: "object", properties: { id: { type: "string" } }, required: ["id"] },
    execute(i) {
      const found = allTasks().find(([, t]) => t.id === i.id); if (!found) throw new Error("Tâche introuvable");
      const t = setTaskDone(S().modules[found[0]].entries, i.id, true, todayISO()); site.save(); render(); return `Terminée : ${t.title}`;
    } },
  { name: "capturer", module: () => inboxId(S().modules), description: "Dépose une note dans la boîte de réception, à trier plus tard.", inputSchema: { type: "object", properties: { texte: { type: "string" } }, required: ["texte"] },
    execute(i) { addCapture(S().modules[inboxId(S().modules)].entries, i.texte, uid(), todayISO()); site.save(); render(); return "Capturé."; } },
  { name: "ajouter_operation", module: () => firstOfType("budget"), description: "Enregistre une dépense ou un revenu dans le premier module Budget.", inputSchema: { type: "object", properties: { montant: { type: "number" }, type: { type: "string", enum: ["dépense", "revenu"] }, enveloppe: { type: "string" }, note: { type: "string" }, date: { type: "string", description: "AAAA-MM-JJ, aujourd'hui par défaut" } }, required: ["montant"] },
    execute(i) { const entry = addBudgetEntry(S().modules[firstOfType("budget")].entries, { amount: i.montant, type: i.type, cat: i.enveloppe, note: i.note, date: i.date }, uid(), todayISO()); site.save(); render(); return `Enregistré : ${money(entry.amount)}`; } }
];
// Premier module actif d'un type, dans l'ordre de la navigation.
const firstOfType = type => (S().config.modules.find(m => m.on && Object.hasOwn(S().modules, m.id) && S().modules[m.id].type === type) || {}).id || null;
// Le module d'un outil peut dépendre des données (la boîte de réception est celle qu'on a désignée).
const toolModule = t => typeof t.module === "function" ? t.module() : t.module;
const availableTools = () => S().config.assistant.actions ? TOOLS.filter(t => { const m = toolModule(t); return m && enabled(m); }) : [];
const executeTool = (name, input) => {
  const tool = availableTools().find(t => t.name === name);
  if (!tool) throw new Error("Action non autorisée ou module désactivé");
  return tool.execute(input);
};
async function askAPI(history) {
  const a = S().config.assistant, tools = availableTools().map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema }));
  const msgs = history.map(m => ({ role: m.role, content: m.content })); let out = "";
  for (let round = 0; round < 5; round++) {
    const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "content-type": "application/json", "x-api-key": getKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: a.model, max_tokens: 1500, system: instructions(), messages: msgs, ...(tools.length ? { tools } : {}) }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    if (!Array.isArray(data.content)) throw new Error("réponse inattendue de l'API");
    const txt = data.content.filter(b => b.type === "text").map(b => b.text).join("\n"); if (txt) out += (out ? "\n\n" : "") + txt;
    if (data.stop_reason !== "tool_use") break;
    msgs.push({ role: "assistant", content: data.content });
    const results = [];
    for (const b of data.content.filter(b => b.type === "tool_use")) { let r; try { r = await executeTool(b.name, b.input || {}); } catch (e) { r = "Erreur : " + e.message; } results.push({ type: "tool_result", tool_use_id: b.id, content: String(r) }); }
    msgs.push({ role: "user", content: results });
  }
  return out || "(pas de réponse)";
}
async function askSample(history, onText) {
  const input = [{ role: "user", content: instructions() }, ...history];
  const opts = { onText: ({ text }) => onText(text) };
  if (availableTools().length) opts.tools = availableTools().map(t => ({ name: t.name, description: t.description, inputSchema: t.inputSchema, execute: i => executeTool(t.name, i) }));
  try { return (await sampleNS(input, opts)).text; }
  catch (e) { if (e && e.code === "tools_unavailable") { delete opts.tools; return (await sampleNS(input, opts)).text; } throw e; }
}
const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>");
async function sendChat(text) {
  if (chatBusy || !text.trim()) return;
  const b = backend(); if (b !== "sample" && b !== "api") return toast("L'assistant n'est pas branché. Voir Réglages.");
  const log = chatLog.get(); log.push({ role: "user", content: text.trim().slice(0, 4000) }); chatLog.set(log); chatBusy = true; if ($("#chatIn")) $("#chatIn").value = ""; render();
  const onText = t => { const p = document.getElementById("pending"); if (p) p.textContent = t; };
  try {
    const hist = log.slice(-20).map(m => ({ role: m.role, content: String(m.content).slice(0, 4000) })); while (hist.length && hist[0].role !== "user") hist.shift();
    const reply = b === "sample" ? await askSample(hist, onText) : await askAPI(hist);
    const l2 = chatLog.get(); l2.push({ role: "assistant", content: reply }); chatLog.set(l2);
  } catch (e) {
    const code = e && e.code, msg = code === "not_granted" ? "Accès refusé à Claude pour cette page." : code === "rate_limited" ? "Trop de demandes, réessaie dans un moment." : (e && e.message) || "Erreur inconnue.";
    toast(msg);
  }
  chatBusy = false; render();
  const log2 = document.querySelector(".chat"); if (log2) log2.lastElementChild?.scrollIntoView({ block: "nearest" });
}
// Une suggestion d'idées pour la première collection affichée en colonnes (un tableau de production).
const ideaChip = () => { const id = Object.keys(S().modules).find(k => S().modules[k].type === "collection" && S().modules[k].config.display === "colonnes" && enabled(k)); return id ? [`Propose trois idées pour ${label(id)}`] : []; };
VIEWS.assistant = () => {
  const b = backend(), a = S().config.assistant, log = chatLog.get();
  const status = b === "sample" ? "Branché via claude.ai : aucune clé requise, la première question te demandera ton accord." : b === "api" ? `Branché via ta clé API, modèle ${esc(a.model)}. Chaque échange est facturé sur ton compte.` : hosted() ? `Pas encore branché. Colle ta clé API dans <a href="#reglages">Réglages</a>.` : "Indisponible dans cette vue.";
  const shared = Object.entries(a.share).filter(([k, v]) => v && enabled(k)).map(([k]) => label(k)).join(", ") || "rien";
  return `<div class="row"><h2 style="margin:0">${esc(label("assistant"))}</h2><span class="spacer"></span>${log.length ? `<button class="btn ghost sm" data-act="chat-clear">Effacer la conversation</button>` : ""}</div>
  <p class="status">${status}<br>Données partagées : ${esc(shared)}. ${a.actions ? "Peut agir sur le tableau de bord." : "Lecture seule."}</p>
  <div class="chat">${log.map(m => `<div class="msg ${m.role === "user" ? "user" : "claude"}">${m.role === "user" ? esc(m.content) : mdLite(m.content)}</div>`).join("")}${chatBusy ? `<div class="msg claude" id="pending">…</div>` : ""}</div>
  ${!log.length ? `<div class="chips">${["Qu'est-ce que je fais aujourd'hui ?", ...(firstOfType("taches") ? [`Fais le point sur ${label(firstOfType("taches"))}`] : []), "Où en est mon budget ce mois-ci ?", ...ideaChip()].map(q => `<button class="btn sm" data-act="chat-chip">${esc(q)}</button>`).join("")}</div>` : ""}
  <div class="capture"><textarea id="chatIn" rows="2" placeholder="Écris à Claude…" aria-label="Message" ${b === "sample" || b === "api" ? "" : "disabled"}></textarea><button class="btn acc" data-act="chat-send" ${chatBusy ? "disabled" : ""}>Envoyer</button></div>`;
};

/* Démarrage : chargé en dernier par build.py, quand toutes les vues et tous les registres existent. */
/* ================= cycle de vie ================= */
const flushAll = () => { board.flush(); site.flush(); };
window.addEventListener("pagehide", flushAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); });
window.addEventListener("storage", e => { if ((e.key === board.key && board.reload()) | (e.key === site.key && site.reload())) render(); });
if (!window.claude) { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }

/* ================= boot ================= */
render();
(async () => {
  try {
    if (!window.claude || !window.claude.use) {
      if (authReady()) { await authBoot(); render(); }
      return;
    }
    const db = await window.claude.use("db");
    if (db) { await site.connect(db); await board.connect(db); } // le site d'abord (voir absorbBoard)
  } catch {}
  try { if (window.claude && window.claude.use) { sampleNS = await window.claude.use("sample"); downloadsNS = await window.claude.use("downloads"); render(); } } catch {}
})();
})();
</script>
<script>if ("serviceWorker" in navigator && !window.claude) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
