  // src/app/modules/programme.js
  function programmeGroupPanel(id) {
    const inst = S().modules[id], c = inst.config, now = todayISO();
    const days = new Set(inst.entries.map((x) => x.date)), cur = Math.min(52, +c.weeks || 12, Math.floor(diffDays(now, c.start) / 7) + 1), out = [];
    for (let w = 0; w < cur; w++) {
      let n = 0;
      for (let d = 0; d < 7; d++) if (days.has(addDaysTo(c.start, w * 7 + d))) n++;
      const den = +c.perWeek || 1;
      out.push({ name: tr`Semaine ${w + 1}`, pct: Math.min(100, Math.round(100 * n / den)), sub: tr`${n} sur ${den} séances` });
    }
    return `<section><h3 style="margin:0 0 4px">${tr`Par semaine`}</h3><p class="hint">${tr`Objectif : ${esc(c.perWeek)} séances par semaine, réglable dans Réglages.`}</p>
    <div class="rooms">${out.map((g) => `<div class="room ${g.pct > 100 ? "over" : ""}"><div class="fill" style="width:${Math.min(100, g.pct)}%"></div><small>${esc(g.name)}</small><b>${tr`${g.pct} %`}</b><small>${esc(g.sub)}</small></div>`).join("") || `<p class="empty">${tr`Rien à regrouper pour l'instant.`}</p>`}</div></section>`;
  }
  var tierCurrent = (c) => (c.tiers || []).find((t) => !t.advancedAt) || null;
  var firstDecisions = () => (S().config.modules.find((m) => m.on && Object.hasOwn(S().modules, m.id) && S().modules[m.id].type === "collection" && S().modules[m.id].config.review) || {}).id || null;
  function tiersPanel(id) {
    const inst = S().modules[id], c = inst.config;
    if (!c.tiers.length) return "";
    const passed = c.tiers.filter((t) => t.advancedAt), cur = tierCurrent(c), crit = cur ? cur.criteria || [] : [];
    const done = crit.filter((cr) => cr.done).length;
    return `<section style="margin-top:28px"><h3 style="margin:0 0 4px">${tr`Paliers`}</h3>
    ${passed.length ? `<p class="hint">${passed.map((t) => tr`« ${esc(t.name)} » atteint le ${fmt(t.advancedAt)}`).join(" · ")}</p>` : ""}
    ${cur ? `<b>${esc(cur.name)}</b>
      <ul class="plain">${crit.map((cr) => `<li class="item" data-id="${esc(cr.id)}"><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" data-act="tier-check" data-mod="${esc(id)}" ${cr.done ? "checked" : ""}>${esc(cr.text)}</label></li>`).join("") || `<li class="empty">${tr`Aucun critère écrit. Ajoutes-en dans ${`<a href="#reglages" data-act="goto-groups" data-mod="${esc(id)}">${tr`Réglages`}</a>`}.`}</li>`}</ul>
      <p class="hint" style="margin:4px 0">${crit.length ? trn(done, "{0} sur {1} coché.", "{0} sur {1} cochés.", trn(crit.length, "{0} critère", "{0} critères")) + " " : ""}${crit.length && done === crit.length ? tr`Tous cochés. Le passage reste ton choix, pas une formalité automatique.` : tr`Coché ou non, rien ne fait avancer le palier à ta place.`}</p>
      <button class="btn sm" data-act="tier-advance" data-mod="${esc(id)}">${tr`Passer au palier suivant`}</button>` : `<p class="hint">${tr`Tous les paliers sont franchis.`}</p>`}
  </section>`;
  }
  registerType("programme", {

  </section></div>`;
    },
    settings: (id, { config: c }) => `<div class="field-row"><label>${tr`Début du protocole`}<input type="date" data-set-mod="${esc(id)}.start" value="${esc(c.start || "")}"></label><label>${tr`Durée (semaines)`}<input type="number" min="1" max="520" data-set-mod="${esc(id)}.weeks" value="${esc(c.weeks)}"></label></div>
    <div class="field-row" style="margin-top:8px"><label>${tr`Unité`}<input data-set-mod="${esc(id)}.unitLabel" value="${esc(c.unitLabel)}" placeholder="min"></label><label>${tr`Séances visées par semaine`}<input type="number" min="1" max="7" data-set-mod="${esc(id)}.perWeek" value="${esc(c.perWeek)}"></label></div>
    <div style="margin-top:14px"><span class="hint" style="margin:0">${tr`Paliers : des critères que tu écris, jamais franchis tout seuls`}</span>
    ${c.tiers.map((t, ti) => `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)">
      <div class="set" data-tri="${ti}" style="grid-template-columns:1fr auto"><input data-act="tier-name" data-mod="${esc(id)}" value="${esc(t.name)}" aria-label="${tr`Nom du palier`}"><div class="row"><button class="btn ghost sm" data-act="tier-up" data-mod="${esc(id)}" aria-label="${tr`Monter`}">↑</button><button class="btn ghost sm" data-act="tier-del" data-mod="${esc(id)}">${tr`suppr.`}</button></div></div>
      <div style="margin:6px 0 0 10px">${(t.criteria || []).map((cr, ci) => `<div class="set" data-tri="${ti}" data-cri="${ci}" style="grid-template-columns:1fr auto"><input data-act="crit-text" data-mod="${esc(id)}" value="${esc(cr.text)}" placeholder="${tr`12 séances à 20 min…`}" aria-label="${tr`Critère`}"><button class="btn ghost sm" data-act="crit-del" data-mod="${esc(id)}">${tr`suppr.`}</button></div>`).join("")}
      <button class="btn ghost sm" data-act="crit-add" data-mod="${esc(id)}" data-tri="${ti}" style="margin-top:4px">+ ${tr`critère`}</button></div></div>`).join("")}
    <button class="btn sm" data-act="tier-add" data-mod="${esc(id)}" style="margin-top:10px">${tr`Ajouter un palier`}</button></div>`,
    summary(id, inst) {

        el.blur();
